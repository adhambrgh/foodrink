; Konfigurasi PHP untuk runtime Vercel. Berkas ini dihapus otomatis saat build.
memory_limit = 512M
opcache.enable = 1
opcache.validate_timestamps = 0

; Jangan bocorkan pesan error/path ke response. Laravel juga menimpa ini saat
; bootstrap; di sini hanya jaring pengaman untuk fase sebelum Laravel siap.
display_errors = Off