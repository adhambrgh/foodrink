name: Run Migrations Post-Deploy

on:
  deployment_status:
    types: [completed]

jobs:
  migrate:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, xml, curl, zip, bcmath
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction
      - name: Run migrations
        run: php artisan migrate --force --no-interaction
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_ENV: production
          APP_DEBUG: false
          APP_URL: ${{ secrets.APP_URL }}
          APP_TIMEZONE: Asia/Jakarta
          APP_LOCALE: id
          APP_FALLBACK_LOCALE: en
          APP_FAKER_LOCALE: id_ID
          APP_MAINTENANCE_DRIVER: file
          BCRYPT_ROUNDS: 12
          LOG_CHANNEL: stderr
          LOG_STACK: single
          LOG_DEPRECATIONS_CHANNEL: null
          LOG_LEVEL: error
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: ${{ secrets.DB_SSLMODE }}
          SESSION_DRIVER: database
          SESSION_LIFETIME: 120
          SESSION_ENCRYPT: false
          SESSION_PATH: /
          SESSION_DOMAIN: ""
          BROADCAST_CONNECTION: log
          FILESYSTEM_DISK: s3
          QUEUE_CONNECTION: database
          CACHE_STORE: database
          MEMCACHED_HOST: 127.0.0.1
          REDIS_CLIENT: phpredis
          REDIS_HOST: 127.0.0.1
          REDIS_PASSWORD: ""
          REDIS_PORT: 6379
          MAIL_MAILER: log
          MAIL_SCHEME: null
          MAIL_HOST: 127.0.0.1
          MAIL_PORT: 2525
          MAIL_USERNAME: null
          MAIL_PASSWORD: null
          MAIL_FROM_ADDRESS: "hello@example.com"
          MAIL_FROM_NAME: "${{ secrets.APP_NAME }}"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
          AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
          AWS_USE_PATH_STYLE_ENDPOINT: ${{ secrets.AWS_USE_PATH_STYLE_ENDPOINT }}
          VITE_APP_NAME: "${{ secrets.APP_NAME }}"
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
          MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY }}
          MIDTRANS_IS_PRODUCTION: ${{ secrets.MIDTRANS_IS_PRODUCTION }}
          MIDTRANS_BATAS_BAYAR_MENIT: ${{ secrets.MIDTRANS_BATAS_BAYAR_MENIT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}